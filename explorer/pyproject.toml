[project]
name = "tt-explorer"
version = "0.1.0"
description = "TUI to explore Tiny Tapeout designs through the tt-explorer firmware"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80",
    "pyserial>=3.5",
]

[project.scripts]
tt-explorer = "tt_explorer.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tt_explorer"]

[dependency-groups]
dev = ["pytest>=8"]
