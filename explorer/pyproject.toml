[project]
name = "bf-explorer"
version = "0.2.0"
description = "The terminal-explorer kit TUI extended with a Brainf*ck tab"
requires-python = ">=3.11"
dependencies = [
    "tt-explorer",
]

[project.scripts]
bf-explorer = "bf_explorer.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bf_explorer"]

# The kit UI comes from the firmware/kit submodule, so one submodule
# pin versions the firmware and the UI together.
[tool.uv.sources]
tt-explorer = { path = "../firmware/kit/explorer", editable = true }

[dependency-groups]
dev = ["pytest>=8"]
